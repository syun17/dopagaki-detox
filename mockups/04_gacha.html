<!doctype html>
<html lang="ja">
<head>

<title>ガチャ | ドパガキデトックス</title>

<style>
body{margin:0}

<style>

.phone{border-radius:28px;overflow:hidden;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.12),0 12px 32px rgba(0,0,0,.10)}
@media (max-width:460px){body{padding:0;background:#fff;align-items:flex-start}.phone{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="phone"><div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #FFFFFF; color: #191C1A; font-family: Roboto, 'Noto Sans JP', sans-serif; box-sizing: border-box">

<header style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
<h1 style="margin: 0; font-size: 22px; font-weight: 500">ガチャ</h1>
<span style="height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border: 1px solid #C2C9BD; border-radius: 8px; font-size: 14px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A5600" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M9 9.5h4.5a2 2 0 0 1 0 4H10"></path></svg>
8,400コイン
</span>

<div style="display: flex; justify-content: center; padding: 16px 0 8px">

<circle cx="170" cy="134" r="20" fill="#EEDFF7" stroke="#7B3A9E" stroke-width="2"></circle>
<circle cx="104" cy="104" r="20" fill="#FDE5D2" stroke="#9A4A0A" stroke-width="2"></circle>
<circle cx="150" cy="96" r="20" fill="#FCEFC7" stroke="#7A5600" stroke-width="2"></circle>
<circle cx="64" cy="100" r="16" fill="#D7F0DC" stroke="#146C2E" stroke-width="2"></circle>
<circle cx="122" cy="58" r="16" fill="#DCE6FB" stroke="#2152B8" stroke-width="2"></circle>
<circle cx="184" cy="88" r="14" fill="#D7F0DC" stroke="#146C2E" stroke-width="2"></circle>
<rect x="40" y="184" width="160" height="80" rx="16" fill="#FFFFFF" stroke="#C2C9BD" stroke-width="2"></rect>

<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 500">ご褒美確定まで あと2回</span><span style="color: #5C6159">3 / 5</span></div>
<div role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="5" aria-label="天井までの進み具合" style="height: 4px; border-radius: 2px; background: #E1E3DF; overflow: hidden"><div style="width: 60%; height: 100%; background: #1E6B45; border-radius: 2px"></div></div>
<span style="font-size: 12px; color: #5C6159">15分以上のやることを5回続けて完了すると、次はご褒美確定</span>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 24px 24px 0">
<div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch">
<a href="06_mission_running.html" style="height: 48px; border-radius: 24px; border: 1px solid #72796F; color: #1E6B45; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">単発 · 600コイン</a>
<span style="font-size: 12px; color: #5C6159; text-align: center">出たらすぐスタート</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch">
<a href="05_gacha_result.html" style="height: 48px; border-radius: 24px; background: #1E6B45; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">10連 · 4,500コイン</a>
<span style="font-size: 12px; color: #5C6159; text-align: center">10個から1つ選べる</span>
</div>
</div>

<section aria-label="出現率" style="margin: 28px 24px 0; border-top: 1px solid #E6E8E4; padding-top: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 14px; font-weight: 500">出現率</h2><a href="08_settings.html" style="font-size: 14px; font-weight: 500; color: #1E6B45; text-decoration: none">中身を見る</a></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; color: #5C6159">N</span><span style="font-size: 16px">50%</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; color: #2152B8">R</span><span style="font-size: 16px">35%</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; color: #7A5600">SR</span><span style="font-size: 16px">12%</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; color: #A8326E">SSR</span><span style="font-size: 16px">3%</span></div>
</div>
<p style="margin: 0; font-size: 12px; line-height: 18px; color: #5C6159">ガチャで出たご褒美は追加のコインなしで始められます。ホームとスワイプのご褒美はこの10分の1の確率で、始めるのにコインが必要です。引いた結果は取り消せません。</p>
</section>

<nav aria-label="メインメニュー" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #F2F4F1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 0 16px; box-sizing: border-box">
<a href="01_home.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #42493F; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#42493F" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-6h-5v6H4z"></path></svg></span>ホーム</a>
<a href="03_swipe.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #42493F; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#42493F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2.5"></rect><path d="M12 15V9M9.5 11.5 12 9l2.5 2.5"></path></svg></span>スワイプ</a>
<a href="04_gacha.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #191C1A; font-size: 12px; font-weight: 700"><span style="width: 64px; height: 32px; border-radius: 16px; background: #D5E8D9; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F1F15" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h6M15 12h6"></path><circle cx="12" cy="12" r="3"></circle></svg></span>ガチャ</a>
<a href="08_settings.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #42493F; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#42493F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></span>設定</a>
</nav>

</div></div>

</html>
